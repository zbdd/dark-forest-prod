<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" name="viewport" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #app {
            position: fixed;
            inset: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #boot-loading {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                calc(env(safe-area-inset-top, 0px) + 24px)
                calc(env(safe-area-inset-right, 0px) + 20px)
                calc(env(safe-area-inset-bottom, 0px) + 24px)
                calc(env(safe-area-inset-left, 0px) + 20px);
            background:
                radial-gradient(circle at top, rgba(53, 84, 55, 0.24), transparent 42%),
                linear-gradient(180deg, rgba(8, 14, 9, 0.98), rgba(5, 7, 6, 0.98));
            transition: opacity 180ms ease;
        }
        #boot-loading.boot-loading--hidden {
            opacity: 0;
            pointer-events: none;
        }
        .boot-loading__panel {
            width: min(360px, 100%);
            padding: 24px 22px 20px;
            border: 1px solid rgba(163, 197, 127, 0.24);
            border-radius: 18px;
            background: rgba(10, 14, 11, 0.82);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }
        .boot-loading__eyebrow {
            color: rgba(198, 221, 175, 0.76);
            font: 700 11px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .boot-loading__title {
            margin: 10px 0 18px;
            color: rgba(255, 248, 230, 0.96);
            font: 700 28px/1.05 Georgia, "Times New Roman", serif;
            letter-spacing: 0.02em;
        }
        .boot-loading__status-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        #boot-loading-status {
            color: rgba(241, 236, 226, 0.88);
            font: 600 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #boot-loading-value {
            color: rgba(198, 221, 175, 0.76);
            font: 700 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0.06em;
        }
        #boot-loading-progress {
            position: relative;
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        #boot-loading-bar {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            border-radius: inherit;
            background:
                linear-gradient(90deg, rgba(140, 176, 99, 0.95), rgba(217, 192, 111, 0.95));
            box-shadow: 0 0 18px rgba(140, 176, 99, 0.35);
            transition: width 140ms ease-out;
        }
        #boot-loading[data-state="error"] #boot-loading-bar {
            background: linear-gradient(90deg, rgba(198, 87, 67, 0.95), rgba(236, 164, 98, 0.95));
            box-shadow: 0 0 18px rgba(198, 87, 67, 0.3);
        }
        #app-version {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
            z-index: 1000;
            color: rgba(255, 255, 255, 0.72);
            font: 600 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0.04em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
            pointer-events: none;
        }
        #run-id {
            position: fixed;
            left: calc(env(safe-area-inset-left, 0px) + 12px);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
            z-index: 1000;
            color: rgba(255, 255, 255, 0.45);
            font: 500 11px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0.04em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
            pointer-events: none;
        }
    </style>
    <title>Dark Forest</title>
  <script type="module" crossorigin src="./assets/index-BmKfuL5k.js"></script>
</head>
<body oncontextmenu="return false;">
    <div aria-live="polite" data-state="loading" id="boot-loading">
        <div class="boot-loading__panel">
            <div class="boot-loading__eyebrow">Dark Forest</div>
            <h1 class="boot-loading__title">Loading the forest</h1>
            <div class="boot-loading__status-row">
                <div id="boot-loading-status">Preparing renderer...</div>
                <div id="boot-loading-value">0%</div>
            </div>
            <div
                aria-label="Game loading progress"
                aria-valuemax="100"
                aria-valuemin="0"
                aria-valuenow="0"
                id="boot-loading-progress"
                role="progressbar"
            >
                <div id="boot-loading-bar"></div>
            </div>
        </div>
    </div>
    <div id="app"></div>
    <div aria-live="off" id="app-version"></div>
    <div aria-live="polite" aria-label="Run ID" id="run-id"></div>
</body>
</html>
